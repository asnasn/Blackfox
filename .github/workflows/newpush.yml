name: newpush

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Create as a pre-release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Mock Mozilla environment
        run: |
          mkdir -p objdir
          cat > ./mach << 'MACHEOF'
          #!/usr/bin/env python3
          import sys
          import json
          import os

          if "environment" in sys.argv:
              print(json.dumps({
                  "topsrcdir": os.getcwd(),
                  "topobjdir": os.path.join(os.getcwd(), "objdir"),
                  "mozconfig": {
                      "env": {
                          "unmodified": {}
                      }
                  },
                  "substs": {
                      "MOZ_BUILD_APP": "mobile/android",
                      "MOZ_APP_VERSION": "120.0a1",
                      "MOZ_UPDATE_CHANNEL": "default",
                      "MOZCONFIG": "dummy",
                      "ANDROID_SDK_ROOT": os.environ.get("ANDROID_HOME", "."),
                      "ANDROID_BUILD_TOOLS_VERSION": "34.0.0",
                      "ENABLE_MOZSEARCH_PLUGIN": False,
                      "DOWNLOAD_ALL_GRADLE_DEPENDENCIES": False,
                      "GRADLE_MAVEN_REPOSITORIES": [
                          "https://maven.google.com",
                          "https://repo.maven.apache.org/maven2",
                          "https://plugins.gradle.org/m2/",
                          "https://maven.mozilla.org/maven2/"
                      ],
                      "ALLOW_INSECURE_GRADLE_REPOSITORIES": False,
                      "PYTHON3": "python3"
                  }
              }), end='')
              sys.exit(0)
          sys.exit(0)
          MACHEOF
          chmod +x ./mach

          echo '{"mozconfig": {"env": {"unmodified": {}}}}' > objdir/.mozconfig.json
          echo '#define MOZ_BUILDID 20260430000000' > objdir/buildid.h
          touch objdir/source-repo.h
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Release APK
        run: |
          export GRADLE_INVOKED_WITHIN_MACH_BUILD=1
          ./gradlew :firefox-bb10:assembleRelease

      - name: Verify APK exists
        run: |
          find objdir/gradle/build -name "*.apk" | grep "release"

      - name: Sign APK
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af016dc794b6407
        id: sign_app
        with:
          releaseDirectory: objdir/gradle/build/mobile/android/firefox-bb10/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0ab8aa5b2ef267dfda
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          tag_name: build-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
