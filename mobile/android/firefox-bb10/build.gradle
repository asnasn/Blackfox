apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'org.mozilla.firefox_bb10'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "org.mozilla.firefox_bb10"
        minSdk 18
        targetSdk 18
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion'
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    // Keep dependencies minimal for API 18 compatibility
}
